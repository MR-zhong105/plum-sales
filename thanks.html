<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单提交成功 | 汶川高山青脆李</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: linear-gradient(160deg, #1a3c2a 0%, #2d6a4f 60%, #52b788 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.6rem; font-weight: 900; color: #1a3c2a; margin-bottom: 0.8rem; }
    p { color: #588157; font-size: 1rem; line-height: 1.8; margin-bottom: 2rem; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #2d6a4f, #1a3c2a);
      color: white;
      padding: 14px 36px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(45,106,79,0.4); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>订单已提交！</h1>
    <p>感谢您的订购！卖家会在收到信息后尽快与您联系确认订单和发货事宜。</p>
    <a href="https://MR-zhong105.github.io/plum-sales/" class="btn">返回主页</a>
  </div>
</body>
</html>
